name: Refresh 911 response time data

on:
  # Quarterly: 1st of Jan, Apr, Jul, Oct at 12:00 UTC
  schedule:
    - cron: "0 12 1 1,4,7,10 *"
  workflow_dispatch:

concurrency:
  group: quarterly-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      - name: Generate 911 data
        run: python scripts/generate_911_data.py
        env:
          AUSTINAPIKEY: ${{ secrets.AUSTINAPIKEY }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/911/data.json
          git diff --cached --quiet || git commit -m "chore: refresh 911 response time data [skip ci]"
          git pull --rebase origin main
          git push
