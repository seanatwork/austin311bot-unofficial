name: Refresh pool data (hybrid: Socrata + scraped city pages)

on:
  schedule:
    - cron: "0 13 * * *"  # daily at 13:00 UTC (8am CT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-pools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Generate pool data
        run: python scripts/generate_pool_data.py
        env:
          AUSTINAPIKEY: ${{ secrets.AUSTINAPIKEY }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/pools/pool-data.json
          git diff --staged --quiet || (git commit -m "feat: refresh pool data (daily scrape)" && git push)
