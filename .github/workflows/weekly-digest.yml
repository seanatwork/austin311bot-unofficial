name: Generate Weekly 311 Digest

on:
  schedule:
    - cron: "30 12 * * 1"  # Monday 12:30 UTC (after daily/weekly maps refresh)
  workflow_dispatch:

concurrency:
  group: weekly-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      - name: Generate weekly digest
        run: python scripts/generate_weekly_digest.py
        env:
          AUSTINAPIKEY: ${{ secrets.AUSTINAPIKEY }}

      - name: Commit and push digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/complaints/digest.json docs/homepage/ticker.json
          git diff --cached --quiet || git commit -m "chore: refresh weekly 311 digest [skip ci]"
          git pull --rebase origin main
          git push
