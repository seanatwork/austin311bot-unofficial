name: Deploy Cloudflare Worker

on:
  push:
    paths:
      - 'workers/query-gateway/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # The worker carries a hand-maintained copy of categories.py's taxonomy
      # (it cannot import Python). Refuse to deploy a drifted copy.
      - name: Check taxonomy sync
        run: python scripts/check_taxonomy_sync.py

      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: workers/query-gateway
          command: deploy
