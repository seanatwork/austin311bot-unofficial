name: Daily data refresh

# Slim daily job — only the genuinely day-sensitive output lives here:
#
#   * homepage card stats (the "N open · M total" number on every card)
#   * pools, fire and shelter snapshots (fallbacks for client-side live pages)
#   * court data cache
#   * querystore (pre-computed 311 aggregates behind /ask) — this also keeps
#     .cache/open311_cache.db warm between weekly runs
#
# Point maps, the crime choropleth, every trends page, fun data and 311 Wrapped
# all live in weekly.yml. Every generator step is `continue-on-error` so a
# single flaky data source can't discard the run; the last step reports them.

on:
  schedule:
    - cron: "0 12 * * *"  # daily at noon UTC
  workflow_dispatch:

concurrency:
  group: daily-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      - name: Restore Open311 cache
        uses: actions/cache@v4
        with:
          path: .cache/open311_cache.db
          key: open311-${{ github.run_id }}
          restore-keys: |
            open311-

      - name: Generate pool data
        id: pool_data
        continue-on-error: true
        run: python scripts/generate_pool_data.py
        env:
          AUSTINAPIKEY: ${{ secrets.AUSTINAPIKEY }}

      - name: Generate fire data snapshots
        id: fire_data
        continue-on-error: true
        # The script exits 2 when Socrata is down and skips the write — we
        # treat that as success so the workflow stays green during outages.
        run: |
          set +e
          python scripts/generate_fire_data.py
          rc=$?
          set -e
          if [ "$rc" = "2" ]; then
            echo "::warning::Socrata is down — fire snapshot preserved, no changes to commit."
            exit 0
          fi
          exit "$rc"
        env:
          AUSTINAPIKEY: ${{ secrets.AUSTINAPIKEY }}

      - name: Generate court data cache
        id: court_data
        continue-on-error: true
        run: python scripts/generate_court_data.py
        env:
          AUSTINAPIKEY: ${{ secrets.AUSTINAPIKEY }}

      - name: Generate shelter data
        id: shelter_data
        continue-on-error: true
        run: python scripts/generate_map.py shelter
        env:
          AUSTINAPIKEY: ${{ secrets.AUSTINAPIKEY }}

      - name: Generate card stats
        id: card_stats
        continue-on-error: true
        # ~23 min of live Open311 window counts — the longest step in CI.
        run: python scripts/generate_card_stats.py
        env:
          AUSTINAPIKEY: ${{ secrets.AUSTINAPIKEY }}

      - name: Generate query data (pre-computed datasets)
        id: query_data
        continue-on-error: true
        run: python scripts/generate_query_data.py
        env:
          AUSTINAPIKEY: ${{ secrets.AUSTINAPIKEY }}

      - name: Save Open311 cache
        uses: actions/cache@v4
        if: always()
        with:
          path: .cache/open311_cache.db
          key: open311-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit and push daily updates
        if: always() && !cancelled()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            docs/pools/pool-data.json \
            docs/fire/data.json \
            docs/fire/trends/data.json \
            docs/homepage/card-stats.json \
            docs/court/data.json \
            docs/court/index.html \
            docs/shelter/data.json \
            docs/querystore/daily_counts.json \
            docs/querystore/district_counts.json \
            docs/querystore/resolution_stats.json \
            docs/querystore/monthly_aggregates.json \
            docs/querystore/service_codes.json
          git diff --cached --quiet || git commit -m "chore: refresh daily data [skip ci]"
          git pull --rebase origin main
          git push

      # Runs after the commit so partial results are never discarded, then fails
      # the run so a broken generator is still visible in Actions.
      - name: Report generator failures
        if: always() && !cancelled()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: python scripts/ci_report_failures.py
