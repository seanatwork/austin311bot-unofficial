            background: #f5f5f5; cursor: pointer; font-size: 12px; color: #444;

    <script>
        var currentDays = 30;
        var showOpen = true;
        var showClosed = true;
        var layerMap = null;
        var leafletMap = null;
        var bucketCounts = {"30": {"open": 27, "closed": 55}, "60": {"open": 45, "closed": 110}, "90": {"open": 70, "closed": 164}};

        function updateSummary() {
            var d = String(currentDays);
            var counts = bucketCounts[d] || {};
            var o = showOpen ? (counts.open || 0) : 0;
            var c = showClosed ? (counts.closed || 0) : 0;
            document.getElementById('map-summary').textContent =
                'Last ' + d + ' days · ' + (o + c) + ' total · ' + o + ' open · ' + c + ' closed';
        }

        function initLayers() {
            layerMap = {"open_30": feature_group_8ed1b6349980905d6ba94abcf39ae5c4, "open_60": feature_group_3fab4b956e9f0c2baba94c7cf66e8dcb, "open_90": feature_group_4dfce82e0d616a1226a9d9ad7efafccd, "closed_30": feature_group_cd6d07842cb2c46a31d6b860034dd049, "closed_60": feature_group_fb0a3a606db4beb8bef5938dbb354e03, "closed_90": feature_group_4d0304ceb6e4ed1a3d9bbfdcb1bc18aa};
            leafletMap = map_17939712993608c75ac0f7be0735a863;
            updateLayers();
            updateSummary();
        }

        function updateLayers() {
            if (!layerMap || !leafletMap) return;
            Object.keys(layerMap).forEach(function(key) {
                var parts = key.split('_');
                var status = parts[0];
                var bucket = parseInt(parts[1]);
                var timeOk = bucket <= currentDays;
                var statusOk = (status === 'open' && showOpen) || (status === 'closed' && showClosed);
                var layer = layerMap[key];
                if (timeOk && statusOk) {
                    if (!leafletMap.hasLayer(layer)) leafletMap.addLayer(layer);
                } else {
                    if (leafletMap.hasLayer(layer)) leafletMap.removeLayer(layer);
                }
            });
        }

        function setDayFilter(days) {
            currentDays = days;
            [30, 60, 90].forEach(function(d) {
                var btn = document.getElementById('btn-' + d);
                if (btn) btn.classList.toggle('active', d === days);
            });
            updateLayers();
            updateSummary();
        }

        function toggleStatus(status) {
