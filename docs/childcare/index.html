        var leafletMap = null;
        var tierCounts = {"high": 2, "medium_high": 0, "medium": 1, "clean": 9};

        function updateSummary() {
            var shown = Object.keys(tierVisible).filter(function(t) { return tierVisible[t]; });

        function initLayers() {
            layerMap = {"high": feature_group_86e377f9e08ed168ef1c420f4e31429c, "medium_high": feature_group_832112fe17f0ce453b7f78386893002d, "medium": feature_group_9a6e0189e85587be2209ee0e4187946a, "clean": feature_group_82b173ffac9542b428221eed93b393c7};
            leafletMap = map_9d3aab8505561d8a2f5e1fd97441d037;
            updateSummary();
        }

        function toggleTier(tier) {
            tierVisible[tier] = !tierVisible[tier];
            document.getElementById('btn-' + tier).classList.toggle('active');
            var layer = layerMap[tier];
            if (tierVisible[tier]) {
                if (!leafletMap.hasLayer(layer)) leafletMap.addLayer(layer);
            } else {
                if (leafletMap.hasLayer(layer)) leafletMap.removeLayer(layer);
            }
            updateSummary();
        }

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(initLayers, 1000);
        });
    </script>
