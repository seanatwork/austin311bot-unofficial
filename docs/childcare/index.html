    <script>
        var tierVisible = {high: true, medium_high: true, medium: true, clean: true};
        var layerMap = null;
        var leafletMap = null;
        var tierCounts = {"high": 2, "medium_high": 0, "medium": 1, "clean": 9};

        function updateSummary() {
            var shown = Object.keys(tierVisible).filter(function(t) { return tierVisible[t]; });
            var total = shown.reduce(function(s, t) { return s + (tierCounts[t] || 0); }, 0);
            document.getElementById('map-summary').textContent =
                total + ' facilities shown · click a marker for details';
        }

        function initLayers() {
            layerMap = {"high": feature_group_3e6f809f8c2a3f5c5cc55cc351e355c7, "medium_high": feature_group_079f3b6d8d860db30e3dc7b13ab4779c, "medium": feature_group_62475a626b9564d906941de60ef62003, "clean": feature_group_c5ba702d9dc7ab94fd0de50faad4e428};
            leafletMap = map_8a67cee68d591f40ef472541e66dcc02;
            updateSummary();
        }

        function toggleTier(tier) {
            tierVisible[tier] = !tierVisible[tier];
            document.getElementById('btn-' + tier).classList.toggle('active');
            var layer = layerMap[tier];
            if (tierVisible[tier]) {
                if (!leafletMap.hasLayer(layer)) leafletMap.addLayer(layer);
            } else {
                if (leafletMap.hasLayer(layer)) leafletMap.removeLayer(layer);
            }
            updateSummary();
        }

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(initLayers, 1000);
        });
    </script>
