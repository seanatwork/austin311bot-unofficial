        var layerMap = null;
        var leafletMap = null;
        var tierCounts = {"high": 3, "medium_high": 0, "medium": 1, "clean": 9};

        function updateSummary() {
            var shown = Object.keys(tierVisible).filter(function(t) { return tierVisible[t]; });
            var total = shown.reduce(function(s, t) { return s + (tierCounts[t] || 0); }, 0);
            document.getElementById('map-summary').textContent =

        }

        function initLayers() {
            layerMap = {"high": feature_group_dd7ab8381b24475a908ad5e42b3c2da1, "medium_high": feature_group_4159307b422ab78db4de603390e928b4, "medium": feature_group_13d47558601d95dde269f4970bd84ee6, "clean": feature_group_e1684d449add0f97f0b8c3bf434b670b};
            leafletMap = map_20306ec81f91bd9a7db65a4b6a5fb420;
            updateSummary();
        }

        function toggleTier(tier) {
            tierVisible[tier] = !tierVisible[tier];
            document.getElementById('btn-' + tier).classList.toggle('active');
            var layer = layerMap[tier];
            if (tierVisible[tier]) {
                if (!leafletMap.hasLayer(layer)) leafletMap.addLayer(layer);
            } else {
                if (leafletMap.hasLayer(layer)) leafletMap.removeLayer(layer);
            }
            updateSummary();
        }

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(initLayers, 1000);
        });
    </script>
