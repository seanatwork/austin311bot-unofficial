        var tierCounts = {"high": 3, "medium_high": 1, "medium": 1, "clean": 10};

        function updateSummary() {
            var shown = Object.keys(tierVisible).filter(function(t) { return tierVisible[t]; });

        function initLayers() {
            layerMap = {"high": feature_group_67d8fbe64d94dcffe8ff96da757af57a, "medium_high": feature_group_d706c32a9087deede792a8f29bd662ef, "medium": feature_group_a1aee756a770ea3257fc7bf4881cce23, "clean": feature_group_188f4bf81152142bf07137202a00d45b};
            leafletMap = map_1d852ad0462b726b30050c4109be6d1e;
            updateSummary();
        }

        function toggleTier(tier) {
            tierVisible[tier] = !tierVisible[tier];
            document.getElementById('btn-' + tier).classList.toggle('active');
            var layer = layerMap[tier];
            if (tierVisible[tier]) {
                if (!leafletMap.hasLayer(layer)) leafletMap.addLayer(layer);
            } else {
                if (leafletMap.hasLayer(layer)) leafletMap.removeLayer(layer);
            }
            updateSummary();
        }

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(initLayers, 1000);
        });
    </script>
