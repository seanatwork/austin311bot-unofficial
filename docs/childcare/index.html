        var layerMap = null;
        var leafletMap = null;
        var tierCounts = {"high": 4, "medium_high": 1, "medium": 2, "clean": 10};

        function updateSummary() {
            var shown = Object.keys(tierVisible).filter(function(t) { return tierVisible[t]; });
            var total = shown.reduce(function(s, t) { return s + (tierCounts[t] || 0); }, 0);
            document.getElementById('map-summary').textContent =

        }

        function initLayers() {
            layerMap = {"high": feature_group_8d0f75256cb15bdf65475cb7bbc07b83, "medium_high": feature_group_67f67f09c6f14a59c505ab00f193c77a, "medium": feature_group_0d2e63013de94ebd3cc709822c5abbd5, "clean": feature_group_c1bfe843082594c2f6f424c398f99a14};
            leafletMap = map_82480ad73fc331802c4ab978fc68b26f;
            updateSummary();
        }

        function toggleTier(tier) {
            tierVisible[tier] = !tierVisible[tier];
            document.getElementById('btn-' + tier).classList.toggle('active');
            var layer = layerMap[tier];
            if (tierVisible[tier]) {
                if (!leafletMap.hasLayer(layer)) leafletMap.addLayer(layer);
            } else {
                if (leafletMap.hasLayer(layer)) leafletMap.removeLayer(layer);
            }
            updateSummary();
        }

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(initLayers, 1000);
        });
    </script>
