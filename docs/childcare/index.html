        var layerMap = null;
        var leafletMap = null;
        var tierCounts = {"high": 3, "medium_high": 0, "medium": 1, "clean": 10};

        function updateSummary() {
            var shown = Object.keys(tierVisible).filter(function(t) { return tierVisible[t]; });
            var total = shown.reduce(function(s, t) { return s + (tierCounts[t] || 0); }, 0);
            document.getElementById('map-summary').textContent =
                total + ' facilities shown · click a marker for details';
        }

        function initLayers() {
            layerMap = {"high": feature_group_740c68a8edb50e160ccabe9085dee08d, "medium_high": feature_group_ae5acec4abde0e767a72d3d960a9cf10, "medium": feature_group_8b34c48d56afc3844f40947d637eb682, "clean": feature_group_7ccc0c04545f03c66f7df02e5de10c21};
            leafletMap = map_17ba4bd2fe876183466610967ea6422d;
            updateSummary();
        }

        function toggleTier(tier) {
            tierVisible[tier] = !tierVisible[tier];
            document.getElementById('btn-' + tier).classList.toggle('active');
            var layer = layerMap[tier];
            if (tierVisible[tier]) {
                if (!leafletMap.hasLayer(layer)) leafletMap.addLayer(layer);
            } else {
                if (leafletMap.hasLayer(layer)) leafletMap.removeLayer(layer);
            }
            updateSummary();
        }

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(initLayers, 1000);
        });
    </script>
