        var layerMap = null;
        var leafletMap = null;
        var tierCounts = {"high": 3, "medium_high": 1, "medium": 2, "clean": 10};

        function updateSummary() {
            var shown = Object.keys(tierVisible).filter(function(t) { return tierVisible[t]; });

            document.getElementById('map-summary').textContent =

        }

        function initLayers() {
            layerMap = {"high": feature_group_1356c0dc9d18f68a18caa78fe96fc8e8, "medium_high": feature_group_58041022d34d57a6e0de9cccda855c1e, "medium": feature_group_ed306539484de14836497aae26e45512, "clean": feature_group_66501a29943db20c8670d26cdbbe4364};
            leafletMap = map_d73ecab10acef5652ab2ac92eecc656b;
            updateSummary();
        }

        function toggleTier(tier) {
            tierVisible[tier] = !tierVisible[tier];
            document.getElementById('btn-' + tier).classList.toggle('active');
            var layer = layerMap[tier];
            if (tierVisible[tier]) {
                if (!leafletMap.hasLayer(layer)) leafletMap.addLayer(layer);
            } else {
                if (leafletMap.hasLayer(layer)) leafletMap.removeLayer(layer);
            }
            updateSummary();
        }

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(initLayers, 1000);
        });
    </script>
