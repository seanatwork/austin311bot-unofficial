        var tierVisible = {high: true, medium_high: true, medium: true, clean: true};

        var leafletMap = null;
        var tierCounts = {"high": 2, "medium_high": 0, "medium": 1, "clean": 9};

        function updateSummary() {
            var shown = Object.keys(tierVisible).filter(function(t) { return tierVisible[t]; });

            document.getElementById('map-summary').textContent =

        function initLayers() {
            layerMap = {"high": feature_group_32713667ca93f8e4bb21c1324a34bbaf, "medium_high": feature_group_221d0e6c376bb119edacb7ec7427c3d3, "medium": feature_group_4eaa4301c98ce290a28317e43df587fd, "clean": feature_group_729f186d8748af0a8c9e981e5822e263};
            leafletMap = map_72d0d77b48c3a8e6120f875a11da17de;
            updateSummary();
        }

        function toggleTier(tier) {
            tierVisible[tier] = !tierVisible[tier];
            document.getElementById('btn-' + tier).classList.toggle('active');
            var layer = layerMap[tier];
            if (tierVisible[tier]) {
                if (!leafletMap.hasLayer(layer)) leafletMap.addLayer(layer);
            } else {
                if (leafletMap.hasLayer(layer)) leafletMap.removeLayer(layer);
            }
            updateSummary();
        }

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(initLayers, 1000);
        });
    </script>
