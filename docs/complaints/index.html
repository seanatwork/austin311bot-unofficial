<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Austin 311 — Weekly 311 Digest</title>
  <meta name="description" content="A weekly curation of the most surprising, revealing 311 complaints filed by Austin residents." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Austin 311 — Weekly 311 Digest" />
  <meta property="og:description" content="The most surprising, funny, and revealing 311 complaints from Austin this week." />
  <meta property="og:url" content="https://austin311.com/complaints/" />
  <meta property="og:image" content="https://austin311.com/og-default.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8fafc;
      --bg-card: #ffffff;
      --bg-card-hover: #f1f5f9;
      --border: #e2e8f0;
      --border-hover: #94a3b8;
      --text: #1e293b;
      --text-head: #0f172a;
      --text-desc: #64748b;
      --text-muted: #64748b;
      --chip-bg: #ffffff;
      --chip-bg-active: #0f172a;
      --chip-text: #475569;
      --chip-text-active: #ffffff;
      --chip-border: #cbd5e1;
      --accent: #3b82f6;
      --accent-dim: #93c5fd;
      --pick-border-1: #3b82f6;
      --pick-border-2: #8b5cf6;
      --pick-border-3: #ec4899;
      --pick-border-4: #f59e0b;
      --pick-border-5: #10b981;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1117;
        --bg-card: #1e2230;
        --bg-card-hover: #252b3b;
        --border: #2d3348;
        --border-hover: #4a5568;
        --text: #e2e8f0;
        --text-head: #f1f5f9;
        --text-desc: #94a3b8;
        --text-muted: #94a3b8;
        --chip-bg: #1e2230;
        --chip-bg-active: #3b82f6;
        --chip-text: #cbd5e1;
        --chip-text-active: #ffffff;
        --chip-border: #3d4868;
        --accent: #60a5fa;
        --accent-dim: #1e3a5f;
        --pick-border-1: #60a5fa;
        --pick-border-2: #a78bfa;
        --pick-border-3: #f472b6;
        --pick-border-4: #fbbf24;
        --pick-border-5: #34d399;
      }
    }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
    }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 1.5rem 1rem 4rem;
    }
    .back {
      display: inline-block;
      color: var(--text-desc);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }
    .back:hover { color: var(--text); }

    .to-top {
      display: block;
      width: fit-content;
      margin: 2rem auto 0;
      padding: 0.5rem 1.1rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--text-desc);
      text-decoration: none;
    }
    .to-top:hover { color: var(--text-head); border-color: var(--border-hover); }

    /* ── header ── */
    .page-header {
      margin-bottom: 1.5rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    .page-header h1 {
      font-size: 1.75rem;
      color: var(--text-head);
      margin-bottom: 0.3rem;
      letter-spacing: -0.02em;
    }
    .page-header .subtitle {
      color: var(--text-desc);
      font-size: 0.92rem;
    }

    /* ── notable complaints ── */
    .picks-section {
      margin-bottom: 2.5rem;
    }
    .picks-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.5rem;
    }
    .pick-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.2rem 1.25rem;
      margin-bottom: 1rem;
      border-left: 4px solid var(--accent);
      transition: border-color 0.15s ease;
    }
    .pick-card:hover { border-color: var(--border-hover); }
    .pick-text {
      font-size: 1.05rem;
      color: var(--text);
      line-height: 1.6;
      margin-bottom: 0.65rem;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-weight: 500;
    }
    .read-more {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      white-space: nowrap;
    }
    .read-more:hover { text-decoration: underline; }
    .pick-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 1rem;
      font-size: 0.78rem;
      color: var(--text-desc);
    }
    .pick-meta a { color: var(--text-desc); text-decoration: none; }
    .pick-meta a:hover { color: var(--accent); }
    .pick-dedup {
      background: var(--accent-dim);
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* ── browse section (divider) ── */
    .browse-divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }
    .browse-divider h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-head);
      white-space: nowrap;
    }
    .browse-divider .divider-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── search ── */
    .search-wrap {
      margin-bottom: 1rem;
    }
    .search-input {
      width: 100%;
      padding: 0.6rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--text-muted); }

    /* ── toggle ── */
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      color: var(--text-desc);
    }
    .toggle-btn {
      padding: 0.55rem 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--chip-border);
      background: var(--chip-bg);
      color: var(--chip-text);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .toggle-btn.active {
      background: var(--chip-bg-active);
      color: var(--chip-text-active);
      border-color: var(--chip-bg-active);
    }
    .toggle-btn:hover:not(.active) {
      border-color: var(--border-hover);
    }

    /* ── chips ── */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }
    /* 24 categories wrap into ~11 rows on a phone and push the actual list
       off the first screen; scroll them sideways instead of stacking. */
    @media (max-width: 640px) {
      .chips {
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .chips::-webkit-scrollbar { display: none; }
      .chip { flex: 0 0 auto; }
      .chip, .toggle-btn { min-height: 44px; }
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.55rem 0.7rem;
      border-radius: 999px;
      border: 1px solid var(--chip-border);
      background: var(--chip-bg);
      color: var(--chip-text);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
      white-space: nowrap;
      font-family: inherit;
    }
    .chip:hover {
      border-color: var(--border-hover);
      background: var(--bg-card-hover);
    }
    .chip.active {
      background: var(--chip-bg-active);
      color: var(--chip-text-active);
      border-color: var(--chip-bg-active);
    }
    .chip.zero { opacity: 0.45; }
    .chip-count {
      font-size: 0.72rem;
      opacity: 0.65;
      font-variant-numeric: tabular-nums;
    }
    .chip.active .chip-count { opacity: 0.85; }

    /* ── list ── */
    .list-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      gap: 1rem;
    }
    .list-header .title {
      font-size: 1rem;
      color: var(--text-head);
      font-weight: 600;
    }
    .list-header .count {
      font-size: 0.8rem;
      color: var(--text-desc);
      font-variant-numeric: tabular-nums;
    }
    .list-tools {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .sort-label {
      font-size: 0.8rem;
      color: var(--text-desc);
    }
    .sort-select {
      padding: 0.35rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text);
      font-size: 0.8rem;
      font-family: inherit;
      cursor: pointer;
    }
    .sort-select:focus { border-color: var(--accent); }
    .list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      transition: border-color 0.15s;
    }
    .item:hover { border-color: var(--border-hover); }
    .item-text {
      color: var(--text);
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 0.4rem;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .item-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      font-size: 0.74rem;
      color: var(--text-desc);
    }
    .item-meta a { color: var(--text-desc); text-decoration: none; }
    .item-meta a:hover { color: var(--accent); text-decoration: underline; }

    /* ── footer ── */
    .footer-note {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .footer-note a { color: var(--text-desc); }

    .empty {
      text-align: center;
      color: var(--text-desc);
      padding: 2rem 1rem;
      font-size: 0.9rem;
    }
    .loading {
      text-align: center;
      color: var(--text-desc);
      padding: 2rem 1rem;
    }
  </style>
</head>
<body id="top">
  <main>
    <a class="back" href="../">← Austin 311</a>
    <noscript>
      <p class="subtitle">This digest is rendered from <code>digest.json</code> and needs JavaScript. You can read the raw data directly: <a href="digest.json">digest.json</a>.</p>
    </noscript>
    <div class="page-header">
      <h1>Weekly 311 Digest</h1>
      <p class="subtitle">The most notable citizen-written complaints filed with Austin 311 this week, ranked by a readability heuristic. City-authored status updates are shown under “All reports”.</p>
      <p class="subtitle" id="lede">Loading…</p>
    </div>

<!-- Notable complaints -->
    <section class="picks-section" id="picks-section"></section>

    <!-- Browse all (divider + search + chips + list) -->
    <div class="browse-divider">
      <h2>🔍 Browse reports</h2>
      <div class="divider-line"></div>
    </div>

    <div class="search-wrap">
      <input type="search" class="search-input" id="search-input" placeholder="Search complaints…" aria-label="Search complaints" />
    </div>

    <div class="toggle-row">
      <span>Show:</span>
      <button class="toggle-btn active" id="toggle-citizen" aria-pressed="true">Citizen-written</button>
      <button class="toggle-btn" id="toggle-all" aria-pressed="false">All reports</button>
    </div>

    <div class="chips" id="chips"></div>

    <div class="list-header">
      <div class="title" id="list-title">Complaints</div>
      <div class="list-tools">
        <div class="count" id="list-count" aria-live="polite"></div>
        <label class="sort-label" for="sort-select">Sort</label>
        <select class="sort-select" id="sort-select">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="category">Category</option>
        </select>
      </div>
    </div>

    <div class="list" id="list">
      <div class="loading">Loading complaints…</div>
    </div>

    <div class="footer-note" id="footer-note"></div>
    <a class="to-top" href="#top">↑ Back to top</a>
  </main>

  <script>
    (function () {
      var CITIZEN = [];
      var CITY = [];
      var ALL = [];
      var CATEGORIES = [];
      var PICK_IDS = {};
      var showAll = false;
      var currentCategory = "__all__";
      var currentQuery = "";
      var currentSort = "newest";

      // Restore filter state from the URL so a filtered view can be linked.
      var pendingCatValidation = false;
      (function readUrlState() {
        var params = new URLSearchParams(location.search);
        var q = params.get("q");
        var cat = params.get("cat");
        var sort = params.get("sort");
        if (q) currentQuery = q;
        if (cat) { currentCategory = cat; pendingCatValidation = true; }
        if (sort === "oldest" || sort === "category") currentSort = sort;
        if (params.get("all") === "1") showAll = true;
        if (currentQuery) {
          var input = document.getElementById("search-input");
          if (input) input.value = currentQuery;
        }
      })();

      var PICK_COLORS = [
        "var(--pick-border-1)", "var(--pick-border-2)", "var(--pick-border-3)",
        "var(--pick-border-4)", "var(--pick-border-5)"
      ];

      function showLoadError(missing) {
        document.getElementById("lede").textContent = missing
          ? "No digest has been published yet."
          : "Couldn't load this week's digest.";
        document.getElementById("list").innerHTML = '<div class="empty">'
          + (missing
              ? "The weekly digest hasn\u2019t been generated for this week yet \u2014 check back after the next run."
              : "The digest data failed to load. This is usually temporary.")
          + ' <button type="button" class="toggle-btn" id="retry-btn">Retry</button></div>';
        ["search-input", "toggle-citizen", "toggle-all"].forEach(function (id) {
          var el = document.getElementById(id);
          if (el) { el.disabled = true; el.style.opacity = "0.5"; }
        });
        document.getElementById("retry-btn").addEventListener("click", function () {
          location.reload();
        });
      }

      fetch("digest.json")
        .then(function (r) {
          if (r.status === 404) { var e = new Error("HTTP 404"); e.missing = true; throw e; }
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function (d) {
          CITIZEN = d.citizenComplaints || [];
          CITY = d.cityResponses || [];
          ALL = CITIZEN.concat(CITY);
          PICK_IDS = {};
          (d.picks || []).forEach(function (p) {
            if (p.ticketId) PICK_IDS[p.ticketId] = true;
          });

          renderPicks(d);
          renderFooter(d);

          if (!CITIZEN.length && !CITY.length) {
            document.getElementById("lede").textContent = "No complaints filed this week.";
            document.getElementById("list").innerHTML = '<div class="empty">No complaints this week.</div>';
            return;
          }

          render();
        })
        .catch(function (err) {
          showLoadError(err && err.missing);
        });

      function activePool() {
        return showAll ? ALL : CITIZEN;
      }

      function matchesQuery(item, q) {
        return (item.text || "").toLowerCase().indexOf(q) !== -1
            || (item.address || "").toLowerCase().indexOf(q) !== -1
            || (item.category || "").toLowerCase().indexOf(q) !== -1
            || (item.id || "").toLowerCase().indexOf(q) !== -1;
      }

      function visibleItems() {
        var pool = activePool();
        var cat = currentCategory;
        var q = currentQuery.trim().toLowerCase();

        if (cat && cat !== "__all__") {
          pool = pool.filter(function (i) { return i.category === cat; });
        }
        // The picks section already shows these; don't list them a second time
        // unless the visitor has narrowed the list deliberately.
        if ((!cat || cat === "__all__") && !q) {
          pool = pool.filter(function (i) { return !PICK_IDS[i.id]; });
        }
        if (q) {
          pool = pool.filter(function (i) { return matchesQuery(i, q); });
        }
        return pool.slice().sort(comparator());
      }

      function render() {
        // Chip order comes from the whole pool so it stays stable while typing;
        // the numbers themselves come from updateChipCounts() and do follow the
        // query, so a search that matches nothing shows zeroes rather than
        // advertising 370 results next to an empty list.
        var pool = activePool();
        var all = {};
        pool.forEach(function (i) {
          all[i.category] = (all[i.category] || 0) + 1;
        });
        CATEGORIES = Object.keys(all).sort(function (a, b) { return all[b] - all[a]; });

        // A ?cat= that no longer exists (stale link) must not select nothing.
        if (pendingCatValidation) {
          pendingCatValidation = false;
          if (currentCategory !== "__all__" && CATEGORIES.indexOf(currentCategory) === -1) {
            currentCategory = "__all__";
          }
        }

        var chips = document.getElementById("chips");
        chips.innerHTML = "";
        chips.appendChild(buildChip("__all__", "All categories", 0));
        CATEGORIES.forEach(function (cat) {
          chips.appendChild(buildChip(cat, cat, 0));
        });

        syncToggles();
        updateChipCounts();
        refreshList();
      }

      function updateChipCounts() {
        var q = currentQuery.trim().toLowerCase();
        var counted = q
          ? activePool().filter(function (i) { return matchesQuery(i, q); })
          : activePool();
        var counts = {};
        counted.forEach(function (i) {
          counts[i.category] = (counts[i.category] || 0) + 1;
        });
        document.querySelectorAll(".chip").forEach(function (c) {
          var value = c.dataset.value;
          var n = value === "__all__" ? counted.length : (counts[value] || 0);
          var badge = c.querySelector(".chip-count");
          if (badge) badge.textContent = n;
          c.classList.toggle("zero", n === 0);
          var on = value === currentCategory;
          c.classList.toggle("active", on);
          c.setAttribute("aria-pressed", on ? "true" : "false");
        });
      }

      function syncToggles() {
        var cit = document.getElementById("toggle-citizen");
        var allBtn = document.getElementById("toggle-all");
        cit.classList.toggle("active", !showAll);
        allBtn.classList.toggle("active", showAll);
        cit.setAttribute("aria-pressed", showAll ? "false" : "true");
        allBtn.setAttribute("aria-pressed", showAll ? "true" : "false");
      }

      function buildChip(value, label, count) {
        var el = document.createElement("button");
        el.className = "chip";
        el.type = "button";
        el.dataset.value = value;
        el.setAttribute("aria-pressed", value === currentCategory ? "true" : "false");
        el.innerHTML = '<span>' + escapeHtml(label) + '</span>'
          + '<span class="chip-count">' + count + '</span>';
        el.addEventListener("click", function () {
          currentCategory = value;
          updateChipCounts();
          refreshList();
          // Keep the chips in view on a phone; only jump on wider screens.
          if (window.innerWidth > 640) {
            window.scrollTo({ top: document.getElementById("list").offsetTop - 80, behavior: "smooth" });
          }
        });
        return el;
      }

      function comparator() {
        if (currentSort === "oldest") {
          return function (a, b) { return (a.date || "").localeCompare(b.date || ""); };
        }
        if (currentSort === "category") {
          return function (a, b) {
            return (a.category || "").localeCompare(b.category || "")
                || (b.date || "").localeCompare(a.date || "");
          };
        }
        return function (a, b) { return (b.date || "").localeCompare(a.date || ""); };
      }

      function writeUrlState() {
        var params = new URLSearchParams();
        if (currentQuery.trim()) params.set("q", currentQuery.trim());
        if (currentCategory !== "__all__") params.set("cat", currentCategory);
        if (showAll) params.set("all", "1");
        if (currentSort !== "newest") params.set("sort", currentSort);
        var qs = params.toString();
        try {
          history.replaceState(null, "", qs ? "?" + qs : location.pathname);
        } catch (e) { /* file:// or sandboxed contexts */ }
      }

      function refreshList() {
        var items = visibleItems();
        var noun = showAll ? "report" : "citizen-written complaint";
        document.getElementById("lede").textContent =
          items.length + " " + noun + (items.length === 1 ? "" : "s")
          + " filed this week in Austin.";
        document.getElementById("list-title").textContent =
          currentCategory === "__all__" ? "Complaints" : currentCategory;
        document.getElementById("list-count").textContent =
          items.length + (items.length === 1 ? " result" : " results");
        writeUrlState();
        renderList(items);
      }

      function fmtDate(d) {
        var parsed = new Date(d + "T12:00:00");
        return isNaN(parsed.getTime())
          ? d
          : parsed.toLocaleDateString("en-US", { month: "short", day: "numeric" });
      }

      function renderList(items) {
        var list = document.getElementById("list");
        if (!items.length) {
          var msg = currentQuery
            ? 'No complaints match "' + escapeHtml(currentQuery) + '".'
            : "No complaints in this category this week.";
          var canClear = currentQuery || currentCategory !== "__all__";
          list.innerHTML = '<div class="empty">' + msg
            + (canClear
                ? ' <button type="button" class="toggle-btn" id="clear-filters">Clear filters</button>'
                : "")
            + '</div>';
          var clearBtn = document.getElementById("clear-filters");
          if (clearBtn) {
            clearBtn.addEventListener("click", function () {
              currentQuery = "";
              currentCategory = "__all__";
              var input = document.getElementById("search-input");
              if (input) input.value = "";
              render();
            });
          }
          return;
        }
        var html = "";
        for (var i = 0; i < items.length; i++) {
          var it = items[i];
          var ticketUrl = it.id
            ? "https://311.austintexas.gov/tickets/" + encodeURIComponent(it.id)
            : null;
          var metaParts = [];
          if (it.address) metaParts.push('<span>' + escapeHtml(it.address) + '</span>');
          if (it.date) metaParts.push('<span>' + escapeHtml(fmtDate(it.date)) + '</span>');
          if (it.category) metaParts.push('<span>' + escapeHtml(it.category) + '</span>');
          if (it.id) {
            metaParts.push('<span><a href="' + ticketUrl + '" target="_blank" rel="noopener">'
              + escapeHtml(it.id) + '</a></span>');
          }
          html += '<div class="item">'
            + '<div class="item-text">' + escapeHtml(it.text || "")
            + (it.truncated && ticketUrl
                ? ' <a class="read-more" href="' + ticketUrl + '" target="_blank" rel="noopener">Read full report \u2192</a>'
                : "")
            + '</div>'
            + '<div class="item-meta">' + metaParts.join(" · ") + '</div>'
            + '</div>';
        }
        list.innerHTML = html;
      }

      function renderPicks(d) {
        var el = document.getElementById("picks-section");
        if (!d || !d.picks || !d.picks.length) {
          el.innerHTML = "";
          return;
        }
        var html = '<h2 class="picks-label">📋 Notable complaints this week</h2>';
        d.picks.forEach(function (pick, idx) {
          var ticketUrl = pick.ticketId
            ? "https://311.austintexas.gov/tickets/" + encodeURIComponent(pick.ticketId)
            : null;
          var color = PICK_COLORS[idx % PICK_COLORS.length];

          html += '<div class="pick-card" style="border-left-color:' + color + '">';

          // Complaint text
          html += '<div class="pick-text">' + escapeHtml(pick.text || "")
            + (pick.truncated && ticketUrl
                ? ' <a class="read-more" href="' + ticketUrl + '" target="_blank" rel="noopener">Read full report \u2192</a>'
                : "")
            + '</div>';

          // Meta line
          html += '<div class="pick-meta">';
          if (pick.address) html += '<span>📍 ' + escapeHtml(pick.address) + '</span>';
          if (pick.category) html += '<span>📂 ' + escapeHtml(pick.category) + '</span>';
          if (pick.date) html += '<span>📅 ' + escapeHtml(fmtDate(pick.date)) + '</span>';
          if (pick.ticketId) {
            html += '<span>🎫 <a href="' + ticketUrl + '" target="_blank" rel="noopener">'
              + escapeHtml(pick.ticketId) + '</a></span>';
          }
          if (pick.dedupCount && pick.dedupCount > 1) {
            html += '<span class="pick-dedup">'
              + (pick.dedupCount - 1) + ' similar this week</span>';
          }
          html += '</div>';

          html += '</div>';
        });

        el.innerHTML = html;
      }

      function renderFooter(d) {
        var el = document.getElementById("footer-note");
        var html = "";
        var meta = d._meta || {};
        if (meta.totalDescriptions) {
          html += "Based on " + meta.totalDescriptions + " reports from the past 7 days";
          if (meta.citizenWritten) {
            html += " (" + meta.citizenWritten + " citizen-written, "
              + meta.cityResponses + " city responses)";
          }
          html += ". ";
        }
        if (meta.generated) {
          html += "Generated " + escapeHtml(fmtDate(meta.generated.slice(0, 10))) + ". ";
        }
        html += 'Data: <a href="https://311.austintexas.gov/open311/v2" target="_blank">Austin Open311 API</a>.';
        el.innerHTML = html;
      }

      // ── Sort ──
      var sortSelect = document.getElementById("sort-select");
      sortSelect.value = currentSort;
      sortSelect.addEventListener("change", function () {
        currentSort = this.value;
        refreshList();
      });

      // ── Search ──
      var searchDebounce = null;
      document.getElementById("search-input").addEventListener("input", function () {
        clearTimeout(searchDebounce);
        var self = this;
        searchDebounce = setTimeout(function () {
          currentQuery = self.value;
          updateChipCounts();
          refreshList();
        }, 250);
      });

      // ── Toggle ──
      document.getElementById("toggle-citizen").addEventListener("click", function () {
        showAll = false;
        this.classList.add("active");
        this.setAttribute("aria-pressed", "true");
        var other = document.getElementById("toggle-all");
        other.classList.remove("active");
        other.setAttribute("aria-pressed", "false");
        render();
      });
      document.getElementById("toggle-all").addEventListener("click", function () {
        showAll = true;
        this.classList.add("active");
        this.setAttribute("aria-pressed", "true");
        var other = document.getElementById("toggle-citizen");
        other.classList.remove("active");
        other.setAttribute("aria-pressed", "false");
        render();
      });

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
    })();
  </script>
</body>
</html>
