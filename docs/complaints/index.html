<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Austin 311 Complaints by Category</title>
  <meta name="description" content="A hub-and-spoke browser of the most colorful, specific, and human 311 complaints filed by Austin residents — sorted by category." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Austin 311 — Complaints by Category" />
  <meta property="og:description" content="Browse what Austin residents are actually complaining about — by category." />
  <meta property="og:url" content="https://austin311.com/complaints/" />
  <meta property="og:image" content="https://austin311.com/og-default.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8fafc;
      --bg-card: #ffffff;
      --bg-card-hover: #f1f5f9;
      --border: #e2e8f0;
      --border-hover: #94a3b8;
      --text: #1e293b;
      --text-head: #0f172a;
      --text-desc: #64748b;
      --chip-bg: #ffffff;
      --chip-bg-active: #0f172a;
      --chip-text: #475569;
      --chip-text-active: #ffffff;
      --chip-border: #cbd5e1;
      --accent: #3b82f6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1117;
        --bg-card: #1e2230;
        --bg-card-hover: #252b3b;
        --border: #2d3348;
        --border-hover: #4a5568;
        --text: #e2e8f0;
        --text-head: #f1f5f9;
        --text-desc: #94a3b8;
        --chip-bg: #1e2230;
        --chip-bg-active: #3b82f6;
        --chip-text: #cbd5e1;
        --chip-text-active: #ffffff;
        --chip-border: #3d4868;
        --accent: #60a5fa;
      }
    }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
    }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 1.5rem 1rem 4rem;
    }
    .back {
      display: inline-block;
      color: var(--text-desc);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
    .back:hover { color: var(--text); }
    h1 {
      font-size: 1.65rem;
      color: var(--text-head);
      margin-bottom: 0.4rem;
      letter-spacing: -0.01em;
    }
    .lede {
      color: var(--text-desc);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .lede strong { color: var(--text); }

    /* ── hub: category chips ── */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--chip-border);
      background: var(--chip-bg);
      color: var(--chip-text);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      white-space: nowrap;
    }
    .chip:hover {
      border-color: var(--border-hover);
      background: var(--bg-card-hover);
    }
    .chip.active {
      background: var(--chip-bg-active);
      color: var(--chip-text-active);
      border-color: var(--chip-bg-active);
    }
    .chip-count {
      font-size: 0.75rem;
      opacity: 0.7;
      font-variant-numeric: tabular-nums;
    }
    .chip.active .chip-count { opacity: 0.85; }

    /* ── spoke: complaints list ── */
    .spoke-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1rem;
      gap: 1rem;
    }
    .spoke-title {
      font-size: 1.1rem;
      color: var(--text-head);
      font-weight: 600;
    }
    .spoke-meta {
      font-size: 0.8rem;
      color: var(--text-desc);
      font-variant-numeric: tabular-nums;
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.1rem;
      transition: border-color 0.15s ease;
    }
    .item:hover { border-color: var(--border-hover); }
    .item-text {
      color: var(--text);
      font-size: 0.97rem;
      line-height: 1.55;
      margin-bottom: 0.6rem;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .item-text a { color: inherit; text-decoration: none; }
    .item-text a:hover { color: var(--accent); }
    .item-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      font-size: 0.78rem;
      color: var(--text-desc);
    }
    .item-meta .addr::before { content: "📍 "; }
    .item-meta .date::before { content: "📅 "; }
    .item-meta .id::before { content: "🎫 "; }
    .item-meta .id a { color: var(--text-desc); text-decoration: none; }
    .item-meta .id a:hover { color: var(--accent); text-decoration: underline; }
    /* ── digest: weekly summary ── */
    .digest-section { margin-bottom: 1.5rem; }
    .digest-headline {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-head);
      margin-bottom: 1rem;
      line-height: 1.5;
    }
    .digest-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .digest-sub a { color: var(--text-desc); }
    .digest-grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .digest-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.1rem;
    }
    .digest-card h3 {
      font-size: 0.95rem;
      color: var(--text-head);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .digest-card h3 .count {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 400;
    }
    .digest-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.35rem;
      font-size: 0.85rem;
    }
    .digest-bar-fill {
      height: 8px;
      border-radius: 4px;
      background: var(--accent);
      min-width: 4px;
      flex-shrink: 0;
    }
    .digest-bar-label {
      color: var(--text);
      white-space: nowrap;
    }
    .digest-bar-count {
      color: var(--text-muted);
      font-size: 0.78rem;
      white-space: nowrap;
    }
    .digest-examples {
      margin-top: 0.5rem;
      padding-left: 0.5rem;
      border-left: 2px solid var(--border);
    }
    .digest-example {
      font-size: 0.82rem;
      color: var(--text-desc);
      margin-bottom: 0.25rem;
      font-style: italic;
    }
    .digest-venue-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .digest-venue-tag {
      background: var(--bg-card-hover);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.2rem 0.6rem;
      font-size: 0.82rem;
      color: var(--text);
    }
    .digest-unusual {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.1rem;
      border-left: 3px solid var(--accent);
    }
    .digest-unusual-text {
      font-size: 0.95rem;
      color: var(--text);
      line-height: 1.55;
      margin-bottom: 0.5rem;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .digest-unusual-meta {
      font-size: 0.78rem;
      color: var(--text-desc);
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .digest-unusual-meta a { color: var(--text-desc); }
    .digest-sentiment {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.8rem 1rem;
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.5;
    }
    .empty {
      text-align: center;
      color: var(--text-desc);
      padding: 2rem 1rem;
      font-size: 0.9rem;
    }
    .loading {
      text-align: center;
      color: var(--text-desc);
      padding: 2rem 1rem;
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../">← Austin 311</a>
    <h1>What Austin is complaining about</h1>
    <p class="lede">Real 311 descriptions from residents. <strong id="total-line">Loading…</strong></p>

    <div class="chips" id="chips"></div>

    <div class="spoke-header">
      <div class="spoke-title" id="spoke-title">All</div>
      <div class="spoke-meta" id="spoke-meta"></div>
    </div>

    <div class="list" id="list">
      <div class="loading">Loading complaints…</div>
    </div>
  </main>

  <script>
    (function () {
      var ALL = [];
      var CATEGORIES = [];
      var current = "__all__";

      var DIGEST = null;

      // Fetch both data sources in parallel
      Promise.all([
        fetch("../fun/data.json").then(function (r) { if (!r.ok) throw new Error("fun/data.json HTTP " + r.status); return r.json(); }),
        fetch("digest.json").then(function (r) { if (!r.ok) return null; return r.json(); }).catch(function () { return null; })
      ]).then(function (results) {
        var funData = results[0];
        DIGEST = results[1];

        var fd = (funData && funData.funnyDescriptions) || {};
        ALL = fd.allItems || fd.items || [];
        if (!ALL.length && !DIGEST) {
          document.getElementById("list").innerHTML = '<div class="empty">No complaints loaded.</div>';
          return;
        }
        render(fd);
      }).catch(function (err) {
        document.getElementById("list").innerHTML = '<div class="empty">Failed to load: ' + escapeHtml(err.message) + '</div>';
      });

      function render(fd) {
        var counts = {};
        ALL.forEach(function (i) { counts[i.category] = (counts[i.category] || 0) + 1; });
        CATEGORIES = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });

        var totalLine = ALL.length + ' complaints across ' + CATEGORIES.length + ' categories, sampled from ' + (fd.totalFetched || 0).toLocaleString() + ' recent 311 requests.';
        document.getElementById("total-line").textContent = totalLine;

        var chips = document.getElementById("chips");
        chips.innerHTML = "";
        if (DIGEST) {
          chips.appendChild(buildChip("__digest__", "📊 This Week", null));
        }
        chips.appendChild(buildChip("__all__", "All", ALL.length));
        CATEGORIES.forEach(function (cat) {
          chips.appendChild(buildChip(cat, cat, counts[cat]));
        });

        var initial = (location.hash || "").replace(/^#/, "");
        if (initial === "__digest__" && DIGEST) {
          select("__digest__");
        } else if (initial && (initial === "__all__" || counts[decodeURIComponent(initial)])) {
          select(decodeURIComponent(initial));
        } else {
          select("__all__");
        }

        window.addEventListener("hashchange", function () {
          var h = decodeURIComponent((location.hash || "").replace(/^#/, ""));
          if (h === "__digest__" && DIGEST) {
            if (h !== current) select(h);
          } else if (h && (h === "__all__" || counts[h]) && h !== current) {
            select(h);
          }
        });
      }

      function buildChip(value, label, count) {
        var el = document.createElement("button");
        el.className = "chip";
        el.type = "button";
        el.dataset.value = value;
        var inner = '<span>' + escapeHtml(label) + '</span>';
        if (count !== null && count !== undefined) {
          inner += '<span class="chip-count">' + count + '</span>';
        }
        el.innerHTML = inner;
        el.addEventListener("click", function () { select(value); });
        return el;
      }

      function select(value) {
        current = value;
        var chips = document.querySelectorAll(".chip");
        chips.forEach(function (c) { c.classList.toggle("active", c.dataset.value === value); });

        if (value === "__digest__" && DIGEST) {
          document.getElementById("spoke-title").textContent = "📊 This Week in 311";
          document.getElementById("spoke-meta").textContent = "";
          renderDigest(DIGEST);
          try {
            history.replaceState(null, "", "#" + encodeURIComponent(value));
          } catch (e) {}
          window.scrollTo({ top: document.querySelector(".spoke-header").offsetTop - 12, behavior: "smooth" });
          return;
        }

        var items = value === "__all__" ? ALL.slice().sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); }) : ALL.filter(function (i) { return i.category === value; });
        document.getElementById("spoke-title").textContent = value === "__all__" ? "All categories" : value;
        document.getElementById("spoke-meta").textContent = items.length + (items.length === 1 ? " complaint" : " complaints");
        renderList(items);

        try {
          history.replaceState(null, "", "#" + encodeURIComponent(value));
        } catch (e) {}

        window.scrollTo({ top: document.querySelector(".spoke-header").offsetTop - 12, behavior: "smooth" });
      }

      function renderDigest(d) {
        var html = '<div class="digest-section">';

        // Headline
        if (d.weeklyHeadline) {
          html += '<div class="digest-headline">' + escapeHtml(d.weeklyHeadline) + '</div>';
        }

        // Sentiment
        if (d.sentimentNote && d.sentimentNote !== "No data available for this period.") {
          html += '<div class="digest-sentiment">' + escapeHtml(d.sentimentNote) + '</div>';
          html += '<div style="height:1rem;"></div>';
        }

        // Most unusual complaint
        if (d.mostUnusualComplaint && d.mostUnusualComplaint.text) {
          var muc = d.mostUnusualComplaint;
          html += '<h3 style="font-size:0.95rem;color:var(--text-head);margin-bottom:0.5rem;">🌟 Most Unusual Complaint</h3>';
          html += '<div class="digest-unusual">';
          html += '<div class="digest-unusual-text">' + escapeHtml(muc.text) + '</div>';
          html += '<div class="digest-unusual-meta">';
          if (muc.address) html += '<span>' + escapeHtml(muc.address) + '</span>';
          if (muc.category) html += '<span>' + escapeHtml(muc.category) + '</span>';
          if (muc.ticketId) {
            html += '<span><a href="https://311.austintexas.gov/tickets/' + encodeURIComponent(muc.ticketId) + '" target="_blank">' + escapeHtml(muc.ticketId) + '</a></span>';
          }
          html += '</div></div>';
          html += '<div style="height:1rem;"></div>';
        }

        // Themes
        if (d.themes && d.themes.length) {
          html += '<h3 style="font-size:0.95rem;color:var(--text-head);margin-bottom:0.5rem;">📊 Top Themes This Week</h3>';
          html += '<div class="digest-grid">';
          var maxCount = d.themes[0].count || 1;
          d.themes.forEach(function (t) {
            var pct = Math.round(t.count / maxCount * 100);
            html += '<div class="digest-card">';
            html += '<h3>' + escapeHtml(t.theme) + ' <span class="count">' + t.count + '</span></h3>';
            html += '<div class="digest-bar"><div class="digest-bar-fill" style="width:' + pct + '%;"></div><span class="digest-bar-count">' + t.count + '</span></div>';
            if (t.examples && t.examples.length) {
              html += '<div class="digest-examples">';
              t.examples.forEach(function (ex) {
                if (ex) html += '<div class="digest-example">"' + escapeHtml(ex.length > 200 ? ex.slice(0, 200) + '…' : ex) + '"</div>';
              });
              html += '</div>';
            }
            html += '</div>';
          });
          html += '</div>';
          html += '<div style="height:1rem;"></div>';
        }

        // Mentioned venues
        if (d.mentionedVenues && d.mentionedVenues.length) {
          html += '<h3 style="font-size:0.95rem;color:var(--text-head);margin-bottom:0.5rem;">📍 Venues & Places Mentioned</h3>';
          html += '<div class="digest-venue-list">';
          d.mentionedVenues.forEach(function (v) {
            if (v) html += '<span class="digest-venue-tag">' + escapeHtml(v) + '</span>';
          });
          html += '</div>';
          html += '<div style="height:1rem;"></div>';
        }

        // Emerging issues
        if (d.emergingIssues && d.emergingIssues.length) {
          html += '<h3 style="font-size:0.95rem;color:var(--text-head);margin-bottom:0.5rem;">🔍 Emerging Issues</h3>';
          html += '<div class="digest-sentiment">';
          d.emergingIssues.forEach(function (issue) {
            if (issue) html += '• ' + escapeHtml(issue) + '<br/>';
          });
          html += '</div>';
        }

        // Footer metadata
        if (d._totalDescriptions) {
          html += '<div class="digest-sub">Based on ' + d._totalDescriptions + ' complaints from the past 7 days. ';
          if (d._fallback) html += '<em>Keyword-generated (LLM unavailable).</em> ';
          html += '<a href="https://github.com/seankim65801/austin311bot-unofficial/blob/main/scripts/generate_weekly_digest.py" target="_blank">How this works</a>.';
          html += '</div>';
        }

        html += '</div>';
        document.getElementById("list").innerHTML = html;
      }

      function renderList(items) {
        var list = document.getElementById("list");
        if (!items.length) {
          list.innerHTML = '<div class="empty">No complaints in this category yet.</div>';
          return;
        }
        var html = "";
        for (var i = 0; i < items.length; i++) {
          var it = items[i];
          var ticketUrl = it.id ? "https://311.austintexas.gov/tickets/" + encodeURIComponent(it.id) : null;
          var textHtml = escapeHtml(it.text || "");
          if (ticketUrl) {
            textHtml = '<a href="' + ticketUrl + '" target="_blank" rel="noopener">' + textHtml + '</a>';
          }
          var metaParts = [];
          if (it.address) metaParts.push('<span class="addr">' + escapeHtml(it.address) + '</span>');
          if (it.date) metaParts.push('<span class="date">' + escapeHtml(it.date) + '</span>');
          if (it.id) {
            metaParts.push('<span class="id"><a href="https://311.austintexas.gov/tickets/' + encodeURIComponent(it.id) + '" target="_blank" rel="noopener">' + escapeHtml(it.id) + '</a></span>');
          }
          html += '<div class="item">'
            + '<div class="item-text">' + textHtml + '</div>'
            + (metaParts.length ? '<div class="item-meta">' + metaParts.join("") + '</div>' : '')
            + '</div>';
        }
        list.innerHTML = html;
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
    })();
  </script>
</body>
</html>
