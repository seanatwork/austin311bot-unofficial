<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Austin 311 — Weekly Digest</title>
  <meta name="description" content="A weekly AI-powered digest of the most interesting, unusual, and revealing 311 complaints filed by Austin residents." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Austin 311 — Weekly Digest" />
  <meta property="og:description" content="A weekly AI-powered digest of Austin 311 complaints." />
  <meta property="og:url" content="https://austin311.com/complaints/" />
  <meta property="og:image" content="https://austin311.com/og-default.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8fafc;
      --bg-card: #ffffff;
      --bg-card-hover: #f1f5f9;
      --border: #e2e8f0;
      --border-hover: #94a3b8;
      --text: #1e293b;
      --text-head: #0f172a;
      --text-desc: #64748b;
      --text-muted: #94a3b8;
      --chip-bg: #ffffff;
      --chip-bg-active: #0f172a;
      --chip-text: #475569;
      --chip-text-active: #ffffff;
      --chip-border: #cbd5e1;
      --accent: #3b82f6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1117;
        --bg-card: #1e2230;
        --bg-card-hover: #252b3b;
        --border: #2d3348;
        --border-hover: #4a5568;
        --text: #e2e8f0;
        --text-head: #f1f5f9;
        --text-desc: #94a3b8;
        --text-muted: #475569;
        --chip-bg: #1e2230;
        --chip-bg-active: #3b82f6;
        --chip-text: #cbd5e1;
        --chip-text-active: #ffffff;
        --chip-border: #3d4868;
        --accent: #60a5fa;
      }
    }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
    }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 1.5rem 1rem 4rem;
    }
    .back {
      display: inline-block;
      color: var(--text-desc);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
    .back:hover { color: var(--text); }
    h1 {
      font-size: 1.65rem;
      color: var(--text-head);
      margin-bottom: 0.4rem;
      letter-spacing: -0.01em;
    }
    .lede {
      color: var(--text-desc);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    /* ── featured complaint ── */
    .featured {
      margin-bottom: 1.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .featured-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.6rem;
    }
    .featured-headline {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-head);
      line-height: 1.5;
      margin-bottom: 0.75rem;
    }
    .featured-text {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.1rem;
      font-size: 0.97rem;
      color: var(--text);
      line-height: 1.55;
      margin-bottom: 0.6rem;
      white-space: pre-wrap;
      word-wrap: break-word;
      border-left: 3px solid var(--accent);
    }
    .featured-meta {
      font-size: 0.78rem;
      color: var(--text-desc);
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }
    .featured-meta a { color: var(--text-desc); }
    .featured-meta a:hover { color: var(--accent); }

    /* ── theme section ── */
    .section-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-head);
      margin-bottom: 0.75rem;
      margin-top: 1.5rem;
    }
    .theme-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.1rem;
      margin-bottom: 0.75rem;
    }
    .theme-card h3 {
      font-size: 0.95rem;
      color: var(--text-head);
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .theme-card h3 .count {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 400;
    }
    .theme-examples {
      padding-left: 0.5rem;
      border-left: 2px solid var(--border);
    }
    .theme-example {
      font-size: 0.82rem;
      color: var(--text-desc);
      margin-bottom: 0.25rem;
      font-style: italic;
    }

    /* ── venue tags ── */
    .venue-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .venue-tag {
      background: var(--bg-card-hover);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.25rem 0.65rem;
      font-size: 0.85rem;
      color: var(--text);
    }

    /* ── emerging issues ── */
    .emerging-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.8rem 1rem;
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.6;
    }

    /* ── sentiment ── */
    .sentiment-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.8rem 1rem;
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.5;
    }

    /* ── hub: category chips ── */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      margin-top: 1.5rem;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--chip-border);
      background: var(--chip-bg);
      color: var(--chip-text);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      white-space: nowrap;
    }
    .chip:hover {
      border-color: var(--border-hover);
      background: var(--bg-card-hover);
    }
    .chip.active {
      background: var(--chip-bg-active);
      color: var(--chip-text-active);
      border-color: var(--chip-bg-active);
    }
    .chip-count {
      font-size: 0.75rem;
      opacity: 0.7;
      font-variant-numeric: tabular-nums;
    }
    .chip.active .chip-count { opacity: 0.85; }

    /* ── spoke: complaints list ── */
    .spoke-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1rem;
      gap: 1rem;
    }
    .spoke-title {
      font-size: 1.1rem;
      color: var(--text-head);
      font-weight: 600;
    }
    .spoke-meta {
      font-size: 0.8rem;
      color: var(--text-desc);
      font-variant-numeric: tabular-nums;
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.1rem;
      transition: border-color 0.15s ease;
    }
    .item:hover { border-color: var(--border-hover); }
    .item-text {
      color: var(--text);
      font-size: 0.97rem;
      line-height: 1.55;
      margin-bottom: 0.6rem;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .item-text a { color: inherit; text-decoration: none; }
    .item-text a:hover { color: var(--accent); }
    .item-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      font-size: 0.78rem;
      color: var(--text-desc);
    }
    .item-meta .addr::before { content: "📍 "; }
    .item-meta .date::before { content: "📅 "; }
    .item-meta .id::before { content: "🎫 "; }
    .item-meta .id a { color: var(--text-desc); text-decoration: none; }
    .item-meta .id a:hover { color: var(--accent); text-decoration: underline; }

    .footer-note {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .footer-note a { color: var(--text-desc); }

    .empty {
      text-align: center;
      color: var(--text-desc);
      padding: 2rem 1rem;
      font-size: 0.9rem;
    }
    .loading {
      text-align: center;
      color: var(--text-desc);
      padding: 2rem 1rem;
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../">← Austin 311</a>
    <h1>What Austin is complaining about</h1>
    <p class="lede" id="lede">Loading…</p>

    <div id="featured" class="featured"></div>
    <div id="digest-sections"></div>

    <div class="chips" id="chips"></div>

    <div class="spoke-header">
      <div class="spoke-title" id="spoke-title">All</div>
      <div class="spoke-meta" id="spoke-meta"></div>
    </div>

    <div class="list" id="list">
      <div class="loading">Loading complaints…</div>
    </div>

    <div class="footer-note" id="footer-note"></div>
  </main>

  <script>
    (function () {
      var ALL = [];
      var CATEGORIES = [];
      var showingAll = false;  // toggled by clicking "All" chip
      var current = "__all__";

      fetch("digest.json")
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (d) {
          ALL = d.complaints || [];
          renderDigestSections(d);
          renderFeatured(d);
          renderFooter(d);

          if (!ALL.length) {
            document.getElementById("list").innerHTML = '<div class="empty">No complaints in this week\'s digest.</div>';
            return;
          }
          render();
        })
        .catch(function (err) {
          document.getElementById("list").innerHTML = '<div class="empty">No digest available yet \u2014 check back after the first weekly run.</div>';
        });

      function isNotable(i) {
        return i.hasOwnProperty('notable') ? i.notable : true;
      }

      function activeForCategory(cat) {
        var pool = showingAll && cat === "__all__" ? ALL : ALL.filter(function (i) { return isNotable(i); });
        if (!cat || cat === "__all__") return pool.slice().sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
        return pool.filter(function (i) { return i.category === cat; }).sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
      }

      function render() {
        var hasNotable = ALL.length > 0 && ALL[0].hasOwnProperty('notable');
        var notableItems = hasNotable ? ALL.filter(function (i) { return i.notable; }) : ALL;
        var notableCounts = {};
        notableItems.forEach(function (i) { notableCounts[i.category] = (notableCounts[i.category] || 0) + 1; });
        CATEGORIES = Object.keys(notableCounts).sort(function (a, b) { return notableCounts[b] - notableCounts[a]; });

        document.getElementById("lede").textContent =
          showingAll
            ? ALL.length + ' total complaints'
            : notableItems.length + ' notable complaints out of ' + ALL.length + ' total';

        var chips = document.getElementById("chips");
        chips.innerHTML = "";
        chips.appendChild(buildChip("__all__", "All " + ALL.length, null));
        CATEGORIES.forEach(function (cat) {
          chips.appendChild(buildChip(cat, cat, notableCounts[cat]));
        });

        // Default: show notable across all categories
        select(current === "__all__" && showingAll ? "__all__" : current);
        // Wait — select resets current, so set it first
        // Actually we need to select the right thing from scratch
        var target = "__all__";
        var initial = (location.hash || "").replace(/^#/, "");
        if (initial === "__all__" || initial === "") {
          // showingAll stays at default false -> notable view
          target = "__all__";
        } else if (notableCounts[decodeURIComponent(initial)]) {
          target = decodeURIComponent(initial);
        }
        current = target;
        select(target);

        window.addEventListener("hashchange", function () {
          var h = decodeURIComponent((location.hash || "").replace(/^#/, ""));
          if (h === "__all__" || notableCounts[h]) {
            if (h === "__all__") { showingAll = true; }
            select(h);
          }
        });
      }

      function buildChip(value, label, count) {
        var el = document.createElement("button");
        el.className = "chip";
        el.type = "button";
        el.dataset.value = value;
        var inner = '<span>' + escapeHtml(label) + '</span>';
        if (count !== null && count !== undefined) {
          inner += '<span class="chip-count">' + count + '</span>';
        }
        el.innerHTML = inner;
        el.addEventListener("click", function () {
          if (value === "__all__") {
            // Toggle showingAll on re-click of All
            showingAll = !showingAll;
            // Re-render chips with updated lede
            var hasNotable = ALL.length > 0 && ALL[0].hasOwnProperty('notable');
            var notableItems = hasNotable ? ALL.filter(function (i) { return i.notable; }) : ALL;
            document.getElementById("lede").textContent =
              showingAll
                ? ALL.length + ' total complaints'
                : notableItems.length + ' notable complaints out of ' + ALL.length + ' total';
            // Update the All chip's active state
            document.querySelectorAll(".chip").forEach(function (c) {
              c.classList.toggle("active", c.dataset.value === value);
            });
            // Show the All list
            current = value;
            renderList(showingAll ? ALL.slice().sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); }) : activeForCategory("__all__"));
            document.getElementById("spoke-title").textContent = showingAll ? "All complaints" : "Notable complaints";
            document.getElementById("spoke-meta").textContent = "";
            try { history.replaceState(null, "", "#__all__"); } catch (e) {}
            window.scrollTo({ top: document.querySelector(".spoke-header").offsetTop - 12, behavior: "smooth" });
          } else {
            // Category chip — always shows notable in that category
            showingAll = false;
            select(value);
          }
        });
        return el;
      }

      function select(value) {
        current = value;
        showingAll = false;
        var chips = document.querySelectorAll(".chip");
        chips.forEach(function (c) { c.classList.toggle("active", c.dataset.value === value); });

        var items = activeForCategory(value);
        document.getElementById("spoke-title").textContent = value === "__all__" ? "Notable complaints" : value;
        document.getElementById("spoke-meta").textContent = items.length + (items.length === 1 ? " complaint" : " complaints");
        renderList(items);

        try {
          history.replaceState(null, "", "#" + encodeURIComponent(value));
        } catch (e) {}

        window.scrollTo({ top: document.querySelector(".spoke-header").offsetTop - 12, behavior: "smooth" });
      }

      function renderList(items) {
        var list = document.getElementById("list");
        if (!items.length) {
          list.innerHTML = '<div class="empty">No complaints in this category this week.</div>';
          return;
        }
        var html = "";
        for (var i = 0; i < items.length; i++) {
          var it = items[i];
          var ticketUrl = it.id ? "https://311.austintexas.gov/tickets/" + encodeURIComponent(it.id) : null;
          var textHtml = escapeHtml(it.text || "");
          if (ticketUrl) {
            textHtml = '<a href="' + ticketUrl + '" target="_blank" rel="noopener">' + textHtml + '</a>';
          }
          var metaParts = [];
          if (it.address) metaParts.push('<span class="addr">' + escapeHtml(it.address) + '</span>');
          if (it.date) metaParts.push('<span class="date">' + escapeHtml(it.date) + '</span>');
          if (it.id) {
            metaParts.push('<span class="id"><a href="https://311.austintexas.gov/tickets/' + encodeURIComponent(it.id) + '" target="_blank" rel="noopener">' + escapeHtml(it.id) + '</a></span>');
          }
          html += '<div class="item">'
            + '<div class="item-text">' + textHtml + '</div>'
            + (metaParts.length ? '<div class="item-meta">' + metaParts.join("") + '</div>' : '')
            + '</div>';
        }
        list.innerHTML = html;
      }

      function renderFeatured(d) {
        var el = document.getElementById("featured");
        if (!d || !d.mostUnusualComplaint || !d.mostUnusualComplaint.text) {
          el.innerHTML = '';
          return;
        }
        var muc = d.mostUnusualComplaint;
        var html = '<div class="featured-label">This week\u2019s most unusual complaint' +
          (d._totalDescriptions ? ' out of ' + d._totalDescriptions + ' reports' : '') + '</div>';
        if (d.weeklyHeadline) {
          html += '<div class="featured-headline">' + escapeHtml(d.weeklyHeadline) + '</div>';
        }
        html += '<div class="featured-text">' + escapeHtml(muc.text) + '</div>';
        html += '<div class="featured-meta">';
        if (muc.address) html += '<span>📍 ' + escapeHtml(muc.address) + '</span>';
        if (muc.category) html += '<span>📂 ' + escapeHtml(muc.category) + '</span>';
        if (muc.ticketId) {
          html += '<span>🎫 <a href="https://311.austintexas.gov/tickets/' + encodeURIComponent(muc.ticketId) + '" target="_blank">' + escapeHtml(muc.ticketId) + '</a></span>';
        }
        html += '</div></div>';
        el.innerHTML = html;
      }

      function renderDigestSections(d) {
        var el = document.getElementById("digest-sections");
        if (!d) { el.innerHTML = ''; return; }
        var html = "";

        // Sentiment (skip generic keyword-fallback one)
        if (d.sentimentNote && d.sentimentNote.indexOf("Keyword analysis") === -1) {
          html += '<div class="section-title">💡 Overall Vibe</div>';
          html += '<div class="sentiment-box">' + escapeHtml(d.sentimentNote) + '</div>';
        }

        // Themes
        if (d.themes && d.themes.length) {
          html += '<div class="section-title">📊 Top Themes</div>';
          d.themes.forEach(function (t) {
            html += '<div class="theme-card">';
            html += '<h3>' + escapeHtml(t.theme) + ' <span class="count">' + t.count + '</span></h3>';
            if (t.examples && t.examples.length) {
              html += '<div class="theme-examples">';
              t.examples.forEach(function (ex) {
                if (ex) html += '<div class="theme-example">\u201c' + escapeHtml(ex.length > 200 ? ex.slice(0, 200) + '\u2026' : ex) + '\u201d</div>';
              });
              html += '</div>';
            }
            html += '</div>';
          });
        }

        // Venues
        if (d.mentionedVenues && d.mentionedVenues.length) {
          html += '<div class="section-title">📍 Venues & Places Mentioned</div>';
          html += '<div class="venue-list">';
          d.mentionedVenues.forEach(function (v) {
            if (v) html += '<span class="venue-tag">' + escapeHtml(v) + '</span>';
          });
          html += '</div>';
        }

        // Emerging issues
        if (d.emergingIssues && d.emergingIssues.length) {
          html += '<div class="section-title">🔍 Emerging Issues</div>';
          html += '<div class="emerging-box">';
          d.emergingIssues.forEach(function (issue) {
            if (issue) html += '\u2022 ' + escapeHtml(issue) + '<br/>';
          });
          html += '</div>';
        }

        el.innerHTML = html;
      }

      function renderFooter(d) {
        var el = document.getElementById("footer-note");
        if (!d) { el.innerHTML = ''; return; }
        var html = '';
        if (d._totalDescriptions) {
          html += 'Based on ' + d._totalDescriptions + ' complaints from the past 7 days. ';
        }
        if (d._fallback) {
          html += '<em>Keyword-generated (AI model unavailable this run).</em> ';
        }
        html += 'Data: <a href="https://311.austintexas.gov/open311/v2" target="_blank">Austin Open311 API</a>.';
        el.innerHTML = html;
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
    })();
  </script>
</body>
</html>
