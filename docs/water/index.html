    <script>
        var currentDays = 90;
        var showOpen = true;
        var showClosed = true;
        var layerMap = null;
        var leafletMap = null;
        var bucketCounts = {"30": {"open": 5, "closed": 82}, "60": {"open": 5, "closed": 227}, "90": {"open": 5, "closed": 395}};

        function updateSummary() {
            var d = String(currentDays);
            var counts = bucketCounts[d] || {};
            var o = showOpen ? (counts.open || 0) : 0;
            var c = showClosed ? (counts.closed || 0) : 0;
            document.getElementById('map-summary').textContent =
                'Last ' + d + ' days · ' + (o + c) + ' total · ' + o + ' open · ' + c + ' closed';
        }

        function initLayers() {
            layerMap = {"open_30": feature_group_b589a4163450b777fa37fddb3c78b471, "open_60": feature_group_c22bd32c4d03e0533e9cfcc6ba59e3de, "open_90": feature_group_04e41bf3d9d583c0e8768856728cce45, "closed_30": feature_group_14abe02152b16e7bc8c95e914e69a596, "closed_60": feature_group_e0baf3b0d98562a6c41122b2b3c2a427, "closed_90": feature_group_fc753577622c25b13073154c21dab218};
            leafletMap = map_ce46e477e27838fcf1b3142dd2eb1b3b;
            updateLayers();
            updateSummary();
        }

        function updateLayers() {
            if (!layerMap || !leafletMap) return;
            Object.keys(layerMap).forEach(function(key) {
                var parts = key.split('_');
                var status = parts[0];
                var bucket = parseInt(parts[1]);
                var timeOk = bucket <= currentDays;
                var statusOk = (status === 'open' && showOpen) || (status === 'closed' && showClosed);
                var layer = layerMap[key];
                if (timeOk && statusOk) {
                    if (!leafletMap.hasLayer(layer)) leafletMap.addLayer(layer);
                } else {
                    if (leafletMap.hasLayer(layer)) leafletMap.removeLayer(layer);
                }
            });
        }

        function setDayFilter(days) {
            currentDays = days;
            [30, 60, 90].forEach(function(d) {
                var btn = document.getElementById('btn-' + d);
                if (btn) btn.classList.toggle('active', d === days);
            });
            updateLayers();
            updateSummary();
        }

        function toggleStatus(status) {
            if (status === 'open') showOpen = !showOpen;
            else showClosed = !showClosed;
            document.getElementById('btn-' + status).classList.toggle('active');
            updateLayers();
            updateSummary();
        }

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(initLayers, 1000);
        });
    </script>
